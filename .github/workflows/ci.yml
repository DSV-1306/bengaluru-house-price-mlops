name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    name: Lint, test, train, quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests with coverage
        run: pytest -v --cov=src --cov=api --cov-report=term-missing

      - name: Train and compare models
        run: python -m src.train

      - name: Upload metrics.json
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: models/metrics.json

      - name: Model quality gate (test R2 >= 0.80)
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("models/metrics.json"))
          print(f"Best model: {m['model_name']}  test R2={m['r2']}  MAE={m['mae']}  RMSE={m['rmse']}")
          if m["r2"] < 0.80:
              sys.exit(f"Quality gate FAILED: R2 {m['r2']} < 0.80")
          print("Quality gate passed")
          EOF

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test-and-train
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api --build-arg MODEL_VERSION=ci-${GITHUB_SHA::7} -t house-price-api:ci .
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t house-price-frontend:ci .
      - run: docker images

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
