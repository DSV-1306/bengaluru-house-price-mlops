name: CD

# Deploys to AKS when a version tag (v1.2.3) is pushed, or manually.
# Skipped until the repository variable ACR_NAME is set (i.e. until Azure exists).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and deploy (e.g. v1.1.0)"
        required: true

permissions:
  id-token: write   # OIDC login to Azure, no stored password
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push to ACR, deploy to AKS
    if: ${{ vars.ACR_NAME != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
      NAMESPACE: house-price
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          az acr login --name "$ACR_NAME"
          echo "ACR_LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build and push API image
        run: |
          docker build -f docker/Dockerfile.api --build-arg MODEL_VERSION="$VERSION" \
            -t "$ACR_LOGIN_SERVER/house-price-api:$TAG" -t "$ACR_LOGIN_SERVER/house-price-api:latest" .
          docker push --all-tags "$ACR_LOGIN_SERVER/house-price-api"

      - name: Build and push frontend image
        run: |
          docker build -f docker/Dockerfile.frontend \
            -t "$ACR_LOGIN_SERVER/house-price-frontend:$TAG" -t "$ACR_LOGIN_SERVER/house-price-frontend:latest" .
          docker push --all-tags "$ACR_LOGIN_SERVER/house-price-frontend"

      - uses: azure/setup-kubectl@v4

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$CLUSTER_NAME" --overwrite-existing

      - name: Deploy (kustomize overlay with the new image tag)
        id: deploy
        run: |
          kubectl kustomize k8s/overlays/aks \
            | sed -e "s|ACR_LOGIN_SERVER|$ACR_LOGIN_SERVER|g" -e "s|IMAGE_TAG|$TAG|g" \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/house-price-api --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/house-price-frontend --timeout=300s

      - name: Smoke test /health (expects the new version)
        run: |
          kubectl -n "$NAMESPACE" exec deploy/house-price-api -- python -c "
          import json, urllib.request
          h = json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5))
          print(h)
          assert h['status'] == 'ok', h
          assert h['model_version'] == '$VERSION', h
          "
          kubectl -n "$NAMESPACE" get svc house-price-frontend

      - name: Roll back on failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          kubectl -n "$NAMESPACE" rollout undo deployment/house-price-api || true
          kubectl -n "$NAMESPACE" rollout undo deployment/house-price-frontend || true
          kubectl -n "$NAMESPACE" rollout status deployment/house-price-api --timeout=300s || true
