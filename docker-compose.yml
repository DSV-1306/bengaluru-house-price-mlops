# Local stack: API + Streamlit + Prometheus + Grafana
#   docker compose up -d --build
# API http://localhost:8000/docs | UI http://localhost:8501 | Prometheus http://localhost:9090 | Grafana http://localhost:3000
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        MODEL_VERSION: ${MODEL_VERSION:-1.0.0}
    image: house-price-api:${MODEL_VERSION:-1.0.0}
    container_name: house-price-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: house-price-frontend:${MODEL_VERSION:-1.0.0}
    container_name: house-price-frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set GRAFANA_ADMIN_PASSWORD in .env (git-ignored); falls back to "admin" for local use only
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
