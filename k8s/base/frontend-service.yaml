apiVersion: v1
kind: Service
metadata:
  name: house-price-frontend
  labels:
    app: house-price-frontend
spec:
  type: LoadBalancer   # public IP on AKS; on minikube open it with "minikube service"
  selector:
    app: house-price-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
