apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-price-frontend
  labels:
    app: house-price-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: house-price-frontend
  template:
    metadata:
      labels:
        app: house-price-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: frontend
          image: house-price-frontend   # real name/tag set by the overlay
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: house-price-config
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
